CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=n
# 3 KB default overflows under LVGL 9's canvas/image composite path with
# HW_STACK_PROTECTION on; built-in lv_label fits but our full-screen canvas
# does not. Symptom is a silent hang during the first display flush.
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=8192